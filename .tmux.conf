# ---- General ----
set -g mode-keys vi
set -g mouse on
set -g set-clipboard on
set -sg escape-time 1

# Default terminal
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -g xterm-keys on
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY LANG LC_CTYPE LC_ALL"

# Indexes
set -g base-index 1
setw -g pane-base-index 1

# Reload
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Prefix (optional)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# ---- Mouse behavior ----
bind -n MouseDown1Pane select-pane -t=
# NOTE: Codex TUI との相性問題回避のため、copy-mode 強制バインドは無効化
# bind -n MouseDrag1Pane select-pane -t= \; copy-mode -e \; send-keys -X begin-selection
# bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -X scroll-up" "select-pane -t=; copy-mode -e; send-keys -X scroll-up"
# bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -X scroll-down" "select-pane -t=; copy-mode -e; send-keys -X scroll-down"

# ---- Pane/Window navigation ----
bind | split-window -h
bind - split-window -v

# Move panes (vim keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# ---- Status / Style ----
set -g status-style "fg=white,bg=black"
setw -g window-status-style "fg=cyan,bg=default,dim"
setw -g window-status-current-style "fg=white,bg=red,bright"
set -g pane-border-style "fg=green,bg=black"
set -g pane-active-border-style "fg=white,bg=yellow"
set -g message-style "fg=white,bg=black,bright"

set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
set -g status-right "#[fg=cyan][%Y-%m-%d(%a) %H:%M]"
set -g status-interval 60
set -g status-justify centre
set -g status-position top

# Activity notifications
setw -g monitor-activity on
set -g visual-activity on

# goyokiki
set -g extended-keys on
set -g allow-passthrough on

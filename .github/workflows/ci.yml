name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - codex/**

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      CHEZMOI_OPTIONAL_SETUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure ~/.local/bin in PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Bash syntax check
        run: |
          bash -n ops/chezmoi/bootstrap.sh \
            ops/chezmoi/verify.sh \
            ops/install/setup-tools.sh \
            ops/codex/import.sh \
            .chezmoiscripts/run_before_10_install_base_packages.sh.tmpl \
            .chezmoiscripts/run_before_20_setup_shell.sh.tmpl \
            .chezmoiscripts/run_before_30_setup_tools.sh.tmpl

      - name: Zsh syntax check
        run: zsh -n .zshrc .config/zsh/*.zsh

      - name: Tool script syntax check
        run: |
          ruby -c tools/scripts/color
          ruby -c tools/scripts/ghbin
          perl -c tools/scripts/diff-highlight
          bash -n tools/scripts/github_latest_release.sh tools/scripts/ike-scan.sh

      - name: Bootstrap dry-run
        run: ./ops/chezmoi/bootstrap.sh --source "$GITHUB_WORKSPACE" --dry-run

      - name: Chezmoi verify
        run: ./ops/chezmoi/verify.sh "$GITHUB_WORKSPACE"

name = "headless script failure preserves the complete diagnostic"
exit_code = 1
inline = """
Godot Engine v4.6.stable.official.89cea1439 - https://godotengine.org
Vulkan 1.3 - Forward+ - Using Device #0: Example GPU
SCRIPT ERROR: Parse Error: Identifier "ExampleType" not declared in the current scope.
          at: GDScript::reload (res://tools/example_tool.gd:17)
ERROR: Failed to load script "res://tools/example_tool.gd" with error "Parse error".
"""

[[expect]]
contains = "SCRIPT ERROR: Parse Error"
[[expect]]
contains = "res://tools/example_tool.gd:17"
[[expect]]
contains = "ERROR: Failed to load script"
[[expect]]
not_contains = "Godot Engine"
[[expect]]
not_contains = "Vulkan 1.3"

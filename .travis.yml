language: minimal
os:
  - linux
  - osx
env:
  global:
    - CHEZMOI_OPTIONAL_SETUP=1
before_install:
  - export PATH="$HOME/.local/bin:$PATH"
script:
  - bash -n scripts/bootstrap-chezmoi.sh scripts/import-codex.sh .chezmoiscripts/run_before_10_install_base_packages.sh.tmpl .chezmoiscripts/run_before_20_setup_shell.sh.tmpl install/install.sh bin/slink.sh bin/chsh.sh
  - zsh -n .zshrc .config/zsh/*.zsh
  - ./scripts/bootstrap-chezmoi.sh --source "$TRAVIS_BUILD_DIR" --dry-run
  - ./scripts/verify-chezmoi.sh "$TRAVIS_BUILD_DIR"
